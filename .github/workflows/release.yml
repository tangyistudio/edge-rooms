# Publishes to npm via Trusted Publishing (OIDC). No NPM_TOKEN is stored anywhere.
#
# IMPORTANT: npm requires the package to already exist before OIDC can be configured.
# First release must be done manually, once:
#   npm login          # browser-based, no token to paste
#   npm publish --access public
#
# Then on npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions:
#   Organization: tangyistudio | Repository: <this repo> | Workflow: release.yml | Environment: npm
#
# After that, every release is just:  git tag v0.1.1 && git push origin v0.1.1
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # OIDC publishing requires npm 11 or newer.
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --access public --provenance
